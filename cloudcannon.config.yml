paths:
  static: public
  uploads: public/uploads
collections_config:
  blog:
    path: content/blog
    url: /blog/[slug]
  notes:
    path: content/notes
    url: /notes/[slug]
_snippets_imports:
  mdx: true
_snippets:
  button:
    template: mdx_component
    inline: false
    preview:
      text: Button
      subtext:
        - key: button_text
    definitions:
      component_name: Button
      named_args:
        - source_key: button_text
          editor_key: button_text
          type: string
        - source_key: button_link
          editor_key: button_link
          type: string
    _inputs:
      button_link:
        type: url
